# Application
spring.application.name=Law_firm_db

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/Law_firm_db
spring.datasource.username=postgres
spring.datasource.password=Devops

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Configure JWT_SECRET with at least 32 characters before starting the backend.
app.jwt.secret=${JWT_SECRET:}